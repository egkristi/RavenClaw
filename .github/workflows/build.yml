name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: read-only by default; individual jobs that need
# write access (release, containers) declare their own job-level permissions.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKERHUB: index.docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Lint & Test ──────────────────────────────────────────────
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: RUST_BACKTRACE=1 cargo test --locked -- --test-threads=1

  # ── Cross-platform Binary Builds ─────────────────────────────
  build-binaries:
    name: Build (${{ matrix.target }})
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            output: ravenclaws-x86_64-unknown-linux-gnu
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            output: ravenclaws-aarch64-unknown-linux-gnu
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            output: ravenclaws-x86_64-unknown-linux-musl
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            output: ravenclaws-x86_64-apple-darwin
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            output: ravenclaws-aarch64-apple-darwin
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            output: ravenclaws-x86_64-pc-windows-msvc.exe
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            output: ravenclaws-aarch64-pc-windows-msvc.exe
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: ${{ matrix.target }}
      - name: Install cross-compilation dependencies (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          for pkg in musl-tools libssl-dev pkg-config cmake; do
            for i in 1 2 3; do
              timeout 120 sudo apt-get install -y --no-install-recommends \
                -o Dpkg::Options::=--force-confdef \
                -o Acquire::Retries=3 \
                "$pkg" && break
              echo "apt-get install $pkg attempt $i failed, retrying..." && sleep 5
            done
          done
        timeout-minutes: 20
      - name: Install native dependencies (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          for pkg in libssl-dev pkg-config cmake; do
            for i in 1 2 3; do
              timeout 120 sudo apt-get install -y --no-install-recommends \
                -o Dpkg::Options::=--force-confdef \
                -o Acquire::Retries=3 \
                "$pkg" && break
              echo "apt-get install $pkg attempt $i failed, retrying..." && sleep 5
            done
          done
        timeout-minutes: 10
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          # Windows targets produce `ravenclaws.exe`; Unix targets produce `ravenclaws`.
          BIN="target/${{ matrix.target }}/release/ravenclaws"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            BIN="${BIN}.exe"
          fi
          cp "$BIN" "dist/${{ matrix.output }}"
          # Archive + checksum with Python (100% portable across Linux/macOS/Windows;
          # avoids shell differences for `zip`/`tar`/`shasum` on Windows).
          python3 -c '
          import hashlib, os, sys, tarfile, zipfile
          dist = "dist"
          output = sys.argv[1]
          archive_kind = sys.argv[2]  # "zip" or "tar.gz"
          binary = os.path.join(dist, output)
          if archive_kind == "zip":
              archive = os.path.join(dist, output + ".zip")
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as z:
                  z.write(binary, output)
          else:
              archive = os.path.join(dist, output + ".tar.gz")
              with tarfile.open(archive, "w:gz") as t:
                  t.add(binary, arcname=output)
          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(65536), b""):
                      h.update(chunk)
              return h.hexdigest()
          with open(os.path.join(dist, output + ".sha256"), "w") as out:
              out.write(sha256(binary) + "  " + output + "\n")
              out.write(sha256(archive) + "  " + os.path.basename(archive) + "\n")
          ' "${{ matrix.output }}" "${{ matrix.archive }}"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ${{ matrix.output }}
          path: dist/*
          if-no-files-found: error

  # ── Container Images (multi-arch, multi-registry) ────────────
  containers:
    name: Container Images
    needs: [check]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      # ── Log in to registries ──────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        if: >
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Generate metadata ─────────────────────────────────────
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        id: meta
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=RavenClaws
            org.opencontainers.image.description=Lightweight, secure Rust agent framework
            org.opencontainers.image.vendor=Erling G M Kristiansen
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # ── Build and push to all registries ──────────────────────
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # ── Sign container (tagged releases only) ─────────────────
      - name: Sign container with Cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Run Cosign sign
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          COSIGN_DEBUG: "1"
        run: |
          cosign sign --yes \
            --use-signing-config=false \
            "${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      # ── Attestation (tagged releases only) ────────────────────
      - name: Generate artifact attestation
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-name: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # ── Vulnerability scan ────────────────────────────────────
      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        if: >
          github.ref == 'refs/heads/master' ||
          startsWith(github.ref, 'refs/tags/v')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          hide-progress: true

      - name: Upload Trivy results to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: container-scan

      # ── SBOM ──────────────────────────────────────────────────
      - name: Generate SBOM with Syft
        continue-on-error: true
        if: >
          github.ref == 'refs/heads/master' ||
          startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM as artifact
        if: always() && hashFiles('sbom.spdx.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: ignore

  # ── Publish to crates.io (tagged only) ───────────────────────
  publish-cratesio:
    name: Publish to crates.io
    needs: [check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - name: Check if version already published
        id: check_published
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          CRATE_NAME=$(grep '^name = ' Cargo.toml | head -1 | sed 's/name = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "crate_name=$CRATE_NAME" >> "$GITHUB_OUTPUT"
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/${CRATE_NAME}/${VERSION}")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Version $VERSION of $CRATE_NAME already published — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION of $CRATE_NAME not found on crates.io — publishing."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to crates.io
        if: steps.check_published.outputs.skip != 'true'
        shell: bash
        # `cargo publish` fails if the version already exists on crates.io (which
        # happens when the earlier build-matrix was broken but the publish job —
        # which only depends on `check` — already succeeded). Treat "already
        # exists" as a non-fatal, idempotent no-op.
        run: |
          set +e
          OUT="$(cargo publish --locked 2>&1)"
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            if echo "$OUT" | grep -qiE "already exists"; then
              echo "Version already published — treating as success."
              exit 0
            fi
            exit $CODE
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── GitHub Release (tagged only) ─────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-binaries, containers]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: ravenclaws-*
          path: dist
          merge-multiple: true
      - name: Organize release assets
        run: |
          mkdir -p release-assets
          find dist -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" -o -type f ! -name ".*" \) -exec cp {} release-assets/ \;
          ls -lh release-assets/
      - name: Generate release notes
        id: release_notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git fetch --tags --force
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1 || echo "")
          if [[ -n "$PREV_TAG" ]]; then
            git log --oneline --no-decorate "$PREV_TAG..HEAD" > changelog.txt
          else
            echo "Initial release" > changelog.txt
          fi
      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          tag_name: ${{ steps.release_notes.outputs.tag }}
          name: RavenClaws ${{ steps.release_notes.outputs.tag }}
          body_path: changelog.txt
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
