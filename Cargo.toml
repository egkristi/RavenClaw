[package]
name = "RavenClaws"
version = "1.8.0"
edition = "2021"
rust-version = "1.88"
authors = ["Erling G M Kristiansen <egkristi@gmail.com>"]
description = "Lightweight, secure Rust agent framework with multi-provider LLM support"
license = "AGPL-3.0-or-later"
repository = "https://github.com/egkristi/RavenClaws"
keywords = ["agent", "ai", "llm", "liteLLM", "ravenfabric"]
categories = ["command-line-utilities", "development-tools"]
homepage = "https://RavenClaws.io"
documentation = "https://docs.rs/ravenclaws"
readme = "README.md"
exclude = [
    "scripts/*",
    "k8s/*",
    "charts/*",
    "docs/*",
    "examples/*",
    "tests/*",
    ".github/*",
    ".githooks/*",
]

[lib]
name = "ravenclaws"
path = "src/lib.rs"

[[bin]]
name = "ravenclaws"
path = "src/main.rs"

[features]
default = ["otel-grpc"]
otel-grpc = ["opentelemetry-otlp"]
otel-stdout = ["opentelemetry-stdout"]
# Kubernetes operator support (programmatic pod lifecycle) — optional to keep the
# default binary small. Enabled with `--features k8s`.
k8s = ["dep:kube", "dep:k8s-openapi"]
# WASM plugin system — optional to keep the default binary small. The wasmtime
# runtime (Cranelift + runtime) is large (~2.5 MB); gate it behind this feature so
# the default binary stays near the ~5 MB "Small" pillar goal.
plugins = ["dep:wasmtime"]
# Terminal UI (ratatui) — optional to keep the default binary small.
tui = ["dep:ratatui", "dep:crossterm"]
# Graphical UI (egui/eframe) — optional to keep the default binary small.
gui = ["dep:eframe", "dep:egui"]

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# HTTP client (multi-provider LLM integration)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async trait for provider abstraction
async-trait = "0.1"

# UUID for request tracking
uuid = { version = "1.6", features = ["v4"] }

# RavenFabric integration — HTTP client built-in (src/ravenfabric.rs), no external crate needed
# When a RavenFabric Rust SDK crate becomes available, add it here

# Configuration
config = { version = "0.15", default-features = false, features = ["toml"] }

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"

# OpenTelemetry (opt-in, for distributed tracing)
# v0.32.1 fixes CVE-2026-48504 (unbounded allocation in W3C Baggage propagation).
opentelemetry = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic"], optional = true }
opentelemetry-stdout = { version = "0.32", features = ["trace"], optional = true }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Streaming
futures = "0.3"

# Environment
dotenvy = "0.15"

# HMAC-SHA256 for audit log chaining
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Date/time for audit timestamps
chrono = { version = "0.4", features = ["serde"] }

# Cryptographically secure random numbers
rand = "0.8"

# URL parsing for policy engine
url = "2.5"

# Cron expression parsing for scheduler (v0.8)
cron = "0.15"

# File system watcher for scheduler triggers (v0.8)
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }

# TOML parsing for eval config files (v0.9)
toml = "0.8"

# YAML parsing for skill manifests (v1.8)
serde_yaml = "0.9"

# Lightweight regex for eval assertions (v0.9)
regex-lite = "0.1"

# Secret zeroization — clear sensitive data from memory on drop (v0.8)
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# SQLite for conversation persistence (v1.0.1)
rusqlite = { version = "0.32", features = ["bundled"] }

# WASM runtime for plugin system (v1.0.1)
# v47 clears all RUSTSEC advisories (incl. 2 CRITICAL sandbox escapes in <36).
# Optional (feature `plugins`) to keep the default binary small.
wasmtime = { version = "47", default-features = false, features = ["cranelift", "runtime"], optional = true }

# Base64 encoding for multi-modal image support (v1.1.0)
base64 = "0.22"

# Kubernetes operator support (v1.4.0, optional via `k8s` feature)
kube = { version = "0.92", features = ["runtime", "derive"], optional = true }
k8s-openapi = { version = "0.22", features = ["v1_30"], optional = true }

# Terminal UI (optional feature `tui`)
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }

# Graphical UI (optional feature `gui`) — immediate-mode, memory-safe Rust UI
eframe = { version = "0.36", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"], optional = true }
egui = { version = "0.36", default-features = false, optional = true }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.5"
wat = "1.22"
serial_test = "3.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
